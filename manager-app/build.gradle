plugins {
    id 'java'
}

group = 'by.ivan101454'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}


test {
    useJUnitPlatform()
}