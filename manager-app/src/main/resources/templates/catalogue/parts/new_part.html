<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Создание запчасти &ndash; Магазин автозапчастей</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <a data-th-href="@{/catalogue/parts/list}">&llarr; К списку запчастей</a>
    <h1>Новая запчасть</h1>
    <div data-th-if="${errors}">
        <h2>Допущены ошибки</h2>
        <ul>
            <li data-th-each="error:${errors}" data-th-text="${error}"></li>
        </ul>
    </div>
    <form method="post" data-th-action="@{/catalogue/parts/create}">
        <label>
            Название запчасти:<br>
            <input type="text" name="name" data-th-value="${partDto?.name}">
        </label><br>
        <label>
            Цена запчасти:<br>
            <input type="text" name="price" data-th-value="${partDto?.price}">
        </label><br>
        <label>
            Страна:<br>
            <select name="codeCarCountry">
                <option data-th-each="country: ${countries}" data-th-value="${country.getCode()}" data-th-text="${country.name()}"></option>
            </select>
        </label><br>
        <label>
            Номер автомобиля:<br>
            <input type="text" name="numberCar">
        </label><br>
        <label>
            Артикул товара:<br>
            <input type="text" name="article" data-th-value="${partDto?.article}">
        </label><br>
        <label>
            Направление:<br>
            <select name="direction">
                <option data-th-each="direct: ${directions}" data-th-value="${direct?.name()}" data-th-text="${direct.name()}"></option>
            </select>
        </label><br>
        <label>
            Сторона:<br>
            <select name="side">
                <option data-th-each="side: ${sides}" data-th-value="${side?.name()}" data-th-text="${side.name()}"></option>
            </select>
        </label><br>
        <br>
        <button type="submit">Сохранить</button>
    </form>

</body>
</html>
