<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Создание запчасти &ndash; Магазин автозапчастей</title>
</head>
<body>
    <a data-th-href="@{/catalogue/parts/list}">&llarr; К списку запчастей</a>
    <h1>Новая запчасть</h1>
    <form method="post" data-th-action="@{/catalogue/parts/create}">
        <label>
            Название запчасти:<br>
            <input type="text" name="name">
        </label><br>
        <label>
            Цена запчасти:<br>
            <input type="text" name="price">
        </label><br>
        <label>
            Страна:<br>
            <select name="country">
                <option data-th-each="country: ${countries}" data-th-value="${country.getCode()}" data-th-text="${country.name()}"></option>
            </select>
        </label><br>
        <label>
            Номер автомобиля:<br>
            <input type="text" name="numberCar">
        </label><br>
        <label>
            Артикул товара:<br>
            <input type="text" name="article">
        </label><br>
        <label>
            Направление:<br>
            <select name="direction">
                <option data-th-each="direct: ${directions}" data-th-value="${direct.name()}" data-th-text="${direct.name()}"></option>
            </select>
        </label><br>
        <label>
            Сторона:<br>
            <select name="direction">
                <option data-th-each="side: ${sides}" data-th-value="${side.name()}" data-th-text="${side.name()}"></option>
            </select>
        </label><br>
        <br>
        <button type="submit">Сохранить</button>
    </form>

</body>
</html>
